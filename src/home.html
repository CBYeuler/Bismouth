<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bismuth</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <main class="welcome-screen">

        <div class="hero">
            <div class="hero-logo">
                <i data-lucide="hexagon"></i>
            </div>
            <h1>Bismuth</h1>
            <h2>Workspace</h2>
            <p>Your local markdown workspace for developers</p>

            <div class="actions">
                <button class="primary-btn" id="create-btn">
                    <i data-lucide="plus"></i>
                    Create New Workspace
                </button>
                <button class="secondary-btn" id="open-btn">
                    <i data-lucide="folder-open"></i>
                    Open Workspace
                </button>
            </div>
        </div>

        <section class="ws">
            <div class="ws-header">
                <i data-lucide="folder"></i>
                <span>YOUR WORKSPACES</span>
            </div>
            <div id="ws-list">
                <p class="ws-empty">No workspaces yet.</p>
            </div>
        </section>

    </main>

    <!-- Modal — no class on it, CSS hides it by default -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3>New Workspace</h3>
            <p>Will be created in ~/Documents/Bismuth/</p>
            <input type="text" id="ws-name-input" placeholder="my-workspace" autocomplete="off" spellcheck="false">
            <div class="modal-actions">
                <button class="secondary-btn" id="modal-cancel">Cancel</button>
                <button class="primary-btn" id="modal-confirm">
                    <i data-lucide="plus"></i>
                    Create
                </button>
            </div>
        </div>
    </div>

    <script src="home.js"></script>
</body>
</html>
