<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bismouth</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-left">
            <span class="app-logo">
                <i data-lucide="hexagon" class="logo-icon"></i>
                <span class="app-name">Bismouth</span>
            </span>
            <div class="filepath-wrap">
                <i data-lucide="folder-open" class="filepath-icon"></i>
                <input type="text" id="filepath" placeholder="No workspace open" autocomplete="off" spellcheck="false">
            </div>
        </div>
        <div class="navbar-right">
            <a href="#">Just</a>
            <a href="#">Useful</a>
            <a href="#">Stuff</a>
            <div class="divider-v"></div>
            <button id="theme-toggle" aria-label="Toggle theme">
                <i data-lucide="sun"></i>
            </button>
        </div>
    </nav>

    <div id="sidebar">

        <div class="sidebar-section-label">
            <span>Explorer</span>
            <div class="sidebar-actions">
                <button class="sidebar-icon-btn" id="new-note-btn" title="New Note">
                    <i data-lucide="file-plus"></i>
                </button>
                <button class="sidebar-icon-btn" id="new-folder-btn" title="New Folder">
                    <i data-lucide="folder-plus"></i>
                </button>
            </div>
        </div>

        <div id="file-tree">

            <div class="tree-item folder open" data-path="notes" data-type="folder">
                <div class="tree-row">
                    <i data-lucide="chevron-right" class="tree-arrow"></i>
                    <i data-lucide="folder" class="tree-icon folder-icon"></i>
                    <span class="tree-label">notes</span>
                </div>
                <div class="tree-children">
                    <div class="tree-item file" data-path="notes/getting-started.md" data-type="file">
                        <div class="tree-row active">
                            <i data-lucide="file-text" class="tree-icon"></i>
                            <span class="tree-label">getting-started.md</span>
                        </div>
                    </div>
                    <div class="tree-item file" data-path="notes/ideas.md" data-type="file">
                        <div class="tree-row">
                            <i data-lucide="file-text" class="tree-icon"></i>
                            <span class="tree-label">ideas.md</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tree-item folder" data-path="archive" data-type="folder">
                <div class="tree-row">
                    <i data-lucide="chevron-right" class="tree-arrow"></i>
                    <i data-lucide="folder" class="tree-icon folder-icon"></i>
                    <span class="tree-label">archive</span>
                </div>
                <div class="tree-children collapsed">
                    <div class="tree-item file" data-path="archive/old-notes.md" data-type="file">
                        <div class="tree-row">
                            <i data-lucide="file-text" class="tree-icon"></i>
                            <span class="tree-label">old-notes.md</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tree-item file" data-path="readme.md" data-type="file">
                <div class="tree-row">
                    <i data-lucide="file-text" class="tree-icon"></i>
                    <span class="tree-label">readme.md</span>
                </div>
            </div>

        </div>

    </div>

    <div id="context-menu" class="hidden">
        <button data-action="rename">
            <i data-lucide="pencil"></i>
            <span>Rename</span>
        </button>
        <button data-action="delete">
            <i data-lucide="trash-2"></i>
            <span>Delete</span>
        </button>
        <div class="context-divider"></div>
        <button data-action="new-note">
            <i data-lucide="file-plus"></i>
            <span>New Note Here</span>
        </button>
    </div>

    <button id="toggle-sidebar" aria-label="Toggle sidebar">
        <i data-lucide="chevron-left" id="toggle-icon"></i>
    </button>

    <div id="main-content">
        <div class="editor-header">
            <span class="editor-tab active">
                <i data-lucide="file-text"></i>
                <span>getting-started.md</span>
            </span>
        </div>
        <div class="editor-wrap">
            <div class="line-numbers" id="line-numbers">1</div>
            <div id="editor" contenteditable="true" spellcheck="true" placeholder="Start writing…"></div>
        </div>
        <div class="statusbar">
            <span id="word-count">0 words</span>
            <span id="char-count">0 chars</span>
            <span class="statusbar-right">Bismouth v0.1</span>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
